name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication `
            -Value 1

          Write-Host "Remote Desktop enabled."

      - name: 2. Create RDP Account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          New-LocalUser `
            -Name "NvDAdmin" `
            -Password $Password `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "NvDAdmin"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "NvDAdmin"

          Write-Host "RDP account created successfully."

      - name: 3. Install Tailscale
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -TimeoutSec 120

          Write-Host "Installing Tailscale..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /qn /norestart" `
            -PassThru

          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw "Tailscale installation timed out."
          }

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

          Write-Host "Tailscale installed successfully."

      - name: 4. Connect Tailscale
        shell: pwsh
        timeout-minutes: 3
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable not found."
          }

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server" `
            --timeout=60s

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $ts_ip = & $tailscale ip -4

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($ts_ip)) {
            throw "Could not obtain Tailscale IP."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "RDP SERVER READY"
          Write-Host "========================================"
          Write-Host "IP       : $ts_ip"
          Write-Host "Username : NvDAdmin"
          Write-Host "Password : Stored in GitHub Secrets"
          Write-Host "========================================"

      - name: 5. Keep Server Alive
        shell: pwsh
        timeout-minutes: 345
        run: |
          Write-Host "RDP server is running."

          for ($i = 1; $i -le 340; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "Server running - minute $i / 340"
          }

          Write-Host "Session completed normally."
